services:
  - type: web
    name: correlation-api
    runtime: python
    rootDir: correlation-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 90 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
